<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Örnek Sayfa</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f7fa;
      color: #1f2937;
    }
    .kart {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="kart">
    <h1>Merhaba!</h1>
    <p>Bu basit bir başlangıç HTML şablonudur. İhtiyacına göre birlikte şekillendirebiliriz.</p>
    <button onclick="alert('Butona tıklandı!')">Tıkla</button>
  </div>
</body>
</html>
